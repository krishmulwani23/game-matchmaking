# Ownership mapping for matchmaking-opt (README section 1)
members:
  1:
    name: "Krish"
    role: "Foundation, simulator, integration, CI"
    paths:
      - "README.md"
      - "DEPENDENCIES.md"
      - "requirements.txt"
      - "pyproject.toml"
      - ".gitignore"
      - "config/default.yaml"
      - "config/owners.yaml"
      - "scripts/"
      - ".github/"
      - ".agent/"
      - "src/mm/types.py"
      - "src/mm/interfaces.py"
      - "src/mm/registry.py"
      - "src/mm/config.py"
      - "src/mm/simulator.py"
      - "src/mm/validate.py"
      - "src/mm/rolling_sim.py"
      - "src/mm/__init__.py"
      - "tests/__init__.py"
      - "tests/test_types*.py"
      - "tests/test_registry*.py"
      - "tests/test_simulator*.py"
      - "tests/test_validate*.py"
      - "tests/test_rolling*.py"
      - "docs/data.md"
      - "docs/REPRODUCE.md"

  2:
    name: "Sarvesh"
    role: "Objectives, baselines, metrics, conflict study"
    paths:
      - "src/mm/objectives.py"
      - "src/mm/baselines.py"
      - "src/mm/metrics.py"
      - "src/mm/benchmarks.py"
      - "src/mm/stats.py"
      - "src/mm/conflict_study.py"
      - "tests/test_objectives*.py"
      - "tests/test_baselines*.py"
      - "tests/test_metrics*.py"
      - "tests/test_stats*.py"
      - "docs/objectives.md"
      - "results/baselines/"
      - "results/conflict/"

  3:
    name: "Vedant"
    role: "Optimization algorithms"
    paths:
      - "src/mm/encoding.py"
      - "src/mm/repair.py"
      - "src/mm/nsga2.py"
      - "src/mm/weighted.py"
      - "src/mm/hybrid.py"
      - "tests/test_encoding*.py"
      - "tests/test_repair*.py"
      - "tests/test_nsga2*.py"
      - "tests/test_weighted*.py"
      - "tests/test_hybrid*.py"
      - "docs/algorithms.md"
      - "config/algorithms_tuned.yaml"

  4:
    name: "RAM"
    role: "Pareto analysis, experiments, relaxation rule, report"
    paths:
      - "src/mm/pareto.py"
      - "src/mm/plots.py"
      - "src/mm/run_experiments.py"
      - "src/mm/relaxation.py"
      - "tests/test_pareto*.py"
      - "tests/test_plots*.py"
      - "tests/test_relaxation*.py"
      - "results/raw/"
      - "results/fronts/"
      - "results/figures/"
      - "docs/report.md"
      - "docs/slides_outline.md"

shared_append_only:
  - "docs/CONTRACT_CHANGES.md"
